files:
  - source: /xml/**/*.xml
    translation: /translations/%two_letters_code%/xml/**/%original_file_name%
    content_segmentation: 0
    translatable_elements:
      - /BMD
      - /BMD/Speakers
      - /BMD/Speakers/Speaker
      - /BMD/Dialog
      - /BMD/Dialog/Page
      - /BMD/Dialog/Option
  - source: /dt_xml/text/**/*.xml
    translation: /translations/%two_letters_code%/dt_xml/text/**/%original_file_name%
    content_segmentation: 0
    translatable_elements:
      - /P3RDataTableText/Text/Translation
    type: xml
    update_option: update_without_changes
  - source: /dt_xml/fstrings/**/*.xml
    translation: /translations/%two_letters_code%/dt_xml/fstrings/**/%original_file_name%
    type: xml
    update_option: update_without_changes
    content_segmentation: 0
    translate_content: 1
    translate_attributes: 0
    translatable_elements:
      - '/P3RDataTableFStrings/String[@role=''value'' or not(@role)]/Translation'
